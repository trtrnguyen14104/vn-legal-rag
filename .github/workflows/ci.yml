name: Checks
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install uv==0.12.5
      - run: uv sync --frozen --extra dev
        working-directory: backend
      - run: uv run --extra dev ruff check src tests && uv run --extra dev ruff format --check src tests && uv run --extra dev pytest -q
        working-directory: backend
      - run: uv build --wheel --sdist --out-dir ../data/refactor-build && .venv/bin/python ../scripts/check_backend_package.py ../data/refactor-build/*.whl
        working-directory: backend
      - run: python scripts/init_env.py
      - run: docker compose -p legal-rag-test -f compose.yaml -f compose.test.yaml up -d --wait db redis
      - run: backend/.venv/bin/python scripts/test_backend.py
      - if: always()
        run: docker compose -p legal-rag-test -f compose.yaml -f compose.test.yaml down --volumes
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run lint && npm run build
        working-directory: frontend
